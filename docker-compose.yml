version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=LogCluster
      - CASSANDRA_NUM_TOKENS=256

  clickhouse:
    image: clickhouse/clickhouse-server:23.4
    ports:
      - "8123:8123"
      - "9000:9000"

  cockroach1:
    image: cockroachdb/cockroach:v23.1.0
    command: start --insecure --join=cockroach1,cockroach2,cockroach3 --advertise-addr=cockroach1
    hostname: cockroach1
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data1:/cockroach/cockroach-data

  cockroach2:
    image: cockroachdb/cockroach:v23.1.0
    command: start --insecure --join=cockroach1,cockroach2,cockroach3 --advertise-addr=cockroach2
    hostname: cockroach2
    volumes:
      - cockroach-data2:/cockroach/cockroach-data

  cockroach3:
    image: cockroachdb/cockroach:v23.1.0
    command: start --insecure --join=cockroach1,cockroach2,cockroach3 --advertise-addr=cockroach3
    hostname: cockroach3
    volumes:
      - cockroach-data3:/cockroach/cockroach-data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - cassandra
      - clickhouse
      - cockroach1
      - cockroach2
      - cockroach3

volumes:
  cockroach-data1:
  cockroach-data2:
  cockroach-data3:
