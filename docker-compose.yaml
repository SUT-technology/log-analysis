version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

  cassandra:
    image: cassandra:4.0
    container_name: cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: "LogCluster"
    ports:
      - "9042:9042"

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  cockroach1:
    image: cockroachdb/cockroach:v23.1.0
    command: start --insecure --join=cockroach1,cockroach2,cockroach3 --advertise-addr=cockroach1
    hostname: cockroach1
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data1:/cockroach/cockroach-data

  cockroach2:
    image: cockroachdb/cockroach:v23.1.0
    command: start --insecure --join=cockroach1,cockroach2,cockroach3 --advertise-addr=cockroach2
    hostname: cockroach2
    volumes:
      - cockroach-data2:/cockroach/cockroach-data

  cockroach3:
    image: cockroachdb/cockroach:v23.1.0
    command: start --insecure --join=cockroach1,cockroach2,cockroach3 --advertise-addr=cockroach3
    hostname: cockroach3
    volumes:
      - cockroach-data3:/cockroach/cockroach-data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-api
    depends_on:
      - kafka
      - cassandra
      - clickhouse
      - cockroach1
      - cockroach2
      - cockroach3
    ports:
      - "8000:8000"

volumes:
  clickhouse-data:
  cockroach-data1:
  cockroach-data2:
  cockroach-data3:
