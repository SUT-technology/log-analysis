version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka2
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

  kafka3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka3
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

  cassandra1:
    image: cassandra:4.0
    container_name: cassandra1
    environment:
      CASSANDRA_CLUSTER_NAME: "LogCluster"
      CASSANDRA_SEEDS: "cassandra1"
      MAX_HEAP_SIZE: "1G"
      HEAP_NEWSIZE: "200M"
    ports:
      - "9042:9042" # Client port
      - "7001:7000" # Internal communication
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512m
    #       cpus: "0.5"

  cassandra2:
    image: cassandra:4.0
    container_name: cassandra2
    environment:
      CASSANDRA_CLUSTER_NAME: "LogCluster"
      CASSANDRA_SEEDS: "cassandra1"
      MAX_HEAP_SIZE: "1G"
      HEAP_NEWSIZE: "200M"
    depends_on:
      - cassandra1
    ports:
      - "9043:9042" # Client port
      - "7002:7000" # Internal communication
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512m
    #       cpus: "0.5"

  cassandra3:
    image: cassandra:4.0
    container_name: cassandra3
    environment:
      CASSANDRA_CLUSTER_NAME: "LogCluster"
      CASSANDRA_SEEDS: "cassandra1"
      MAX_HEAP_SIZE: "1g"
      HEAP_NEWSIZE: "200M"
    depends_on:
      - cassandra1
    ports:
      - "9044:9042" # Client port
      - "7003:7000" # Internal communication
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512m
    #       cpus: "0.5"

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  cockroach1:
    image: cockroachdb/cockroach:v23.1.0
    command: start --insecure --join=cockroach1,cockroach2,cockroach3 --advertise-addr=cockroach1
    hostname: cockroach1
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data1:/cockroach/cockroach-data

  cockroach2:
    image: cockroachdb/cockroach:v23.1.0
    command: start --insecure --join=cockroach1,cockroach2,cockroach3 --advertise-addr=cockroach2
    hostname: cockroach2
    volumes:
      - cockroach-data2:/cockroach/cockroach-data

  cockroach3:
    image: cockroachdb/cockroach:v23.1.0
    command: start --insecure --join=cockroach1,cockroach2,cockroach3 --advertise-addr=cockroach3
    hostname: cockroach3
    volumes:
      - cockroach-data3:/cockroach/cockroach-data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-api
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - cassandra1
      - cassandra2
      - cassandra3
      - clickhouse
      - cockroach1
      - cockroach2
      - cockroach3
    ports:
      - "8000:8000"

volumes:
  clickhouse-data:
  cockroach-data1:
  cockroach-data2:
  cockroach-data3:
  cassandra-data:
